<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base de datos técnica de inspección · INVIAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Leaflet: motor de mapas para OpenStreetMap (única librería adicional a Firebase y Google Fonts) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2a3a;--mut:#5f6f82;--line:#d9e0e8;--brand:#EB773B;--brand2:#fdf0e8;--g:#2e9e5b;--o:#f08c1a;--r:#d93636}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:#fff;border-bottom:3px solid var(--brand);padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo img{height:58px}
.logo .ph{height:52px;min-width:120px;display:flex;align-items:center;font-weight:700;font-size:26px;color:var(--brand);letter-spacing:1px;border-right:2px solid var(--line);padding-right:14px}
.logo small{display:block;color:var(--mut);font-size:12px}
.logo b{font-size:16px}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--r)}.dot.ok{background:var(--g);box-shadow:0 0 0 4px #2e9e5b30}
nav{display:flex;gap:4px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line)}
nav button{border:0;background:none;padding:12px 18px;font:inherit;font-weight:500;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
nav button.on{color:var(--brand);border-color:var(--brand)}
main{padding:18px 20px;max-width:1500px;margin:auto}
.tab{display:none}.tab.on{display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
input,select,button{font:inherit}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.bar input[type=search]{flex:1;min-width:180px}
.vsel{display:flex;flex-direction:column;gap:3px;font-weight:600;font-size:12px;color:var(--brand)}.vsel select{border:2px solid var(--brand);font-weight:500;color:var(--ink);min-width:200px}
textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;resize:vertical;min-height:80px}
.com{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px}.com b{color:var(--mut);font-weight:500}.com p{margin:3px 0 0;white-space:pre-wrap}
.btn{padding:8px 14px;border-radius:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;font-weight:500;cursor:pointer}
.btn.sec{background:#fff;color:var(--brand)}.btn.red{background:var(--r);border-color:var(--r)}.btn.on{background:var(--o);border-color:var(--o)}
.btn.sm{padding:5px 10px;font-size:13px}
details.via{margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:8px}
details.via>summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:16px;color:var(--brand);list-style:none;display:flex;justify-content:space-between}
details.via>summary::after{content:"▾"}details.via[open]>summary::after{content:"▴"}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;padding:4px 16px 16px}
.card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.card .ph{width:100%;height:170px;object-fit:cover;background:#e9edf2;display:block}
.nofoto{height:170px;display:flex;align-items:center;justify-content:center;background:#e9edf2;color:var(--mut)}
.mos{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}.mos img{width:100%;height:70px;object-fit:cover;border-radius:3px}
.body{padding:12px;flex:1}
.body h4{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}dt{color:var(--mut)}dd{margin:0;text-align:right}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
.badge.B{background:var(--g)}.badge.M{background:var(--o)}.badge.A{background:var(--r)}
.acts{display:flex;gap:6px;padding:0 12px 12px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:50px 10px;background:#fff;border:1px dashed var(--line);border-radius:8px}
#map{height:calc(100vh - 260px);min-height:420px;border:1px solid var(--line);border-radius:8px}
.leg{display:flex;gap:14px;align-items:center;color:var(--mut);font-size:13px}.leg i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.pin{width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px #0006}
.leaflet-popup-content{width:290px!important;max-height:420px;overflow:auto;font-family:'IBM Plex Sans',sans-serif}
.modal{position:fixed;inset:0;background:#0a1a2c99;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:2000}
.modal.on{display:flex}
.box{background:#fff;border-radius:10px;width:100%;max-width:720px;padding:20px}
.box h3{margin:0 0 14px;color:var(--brand)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f label{display:flex;flex-direction:column;gap:4px;font-weight:500;font-size:13px}.f .full{grid-column:1/-1}
.f fieldset{border:1px solid var(--line);border-radius:8px;margin:0;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.f legend{font-weight:600;color:var(--brand);padding:0 6px}
.hide{display:none!important}
.prev{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.prev div{position:relative}.prev img{width:96px;height:72px;object-fit:cover;border-radius:6px;border:2px solid var(--line)}
.prev .main img{border-color:var(--brand)}.prev span{position:absolute;left:3px;bottom:3px;background:var(--brand);color:#fff;font-size:10px;padding:1px 5px;border-radius:4px}
.prev button{position:absolute;right:2px;top:2px;border:0;background:#000a;color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer}
.hint{font-weight:400;color:var(--mut);font-size:12px}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
footer{text-align:center;color:var(--mut);padding:18px;font-size:12px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:3000}
@media(max-width:600px){.f{grid-template-columns:1fr}.f fieldset{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo"></div>
  <div class="status"><span class="dot" id="dot"></span><span id="stxt">Conectando…</span></div>
</header>
<nav>
  <button class="on" data-tab="t1">Fichas técnicas</button>
  <button data-tab="t2">Mapa interactivo</button>
</nav>
<main>
<section class="tab on" id="t1">
  <div class="bar">
    <label class="vsel">Vía a consultar<select id="fVia"></select></label>
    <input type="search" id="q" placeholder="Buscar por PR, tipología, comentarios…">
    <select id="fCalz"></select><select id="fCar"></select><select id="fTipo"></select><select id="fTip"></select><select id="fSev"></select>
    <button class="btn" data-act="new">+ Añadir ficha</button>
    <button class="btn sec" id="xlsBtn" data-act="export">Exportar a Excel</button>
  </div>
  <div id="list"></div>
</section>
<section class="tab" id="t2">
  <div class="bar">
    <button class="btn sec" id="pinMode" data-act="pinmode">Añadir pin: desactivado</button>
    <div class="leg"><span><i style="background:var(--g)"></i>Baja</span><span><i style="background:var(--o)"></i>Media</span><span><i style="background:var(--r)"></i>Alta</span></div>
    <span class="hint" id="mapHint"></span>
  </div>
  <div id="map"></div>
</section>
</main>
<footer>Desarrollado por Mateo Ortiz y Juan David Mendoza</footer>

<!-- Modal ficha -->
<div class="modal" id="mFicha"><div class="box">
  <h3 id="mTitle">Añadir ficha</h3>
  <div class="f" id="form">
    <label>Vía<select id="via"></select></label>
    <label>No. de calzadas<select id="ncal"><option>1</option><option>2</option></select></label>
    <label id="calW" class="hide">Calzada<select id="calz"><option>Derecha</option><option>Izquierda</option></select></label>
    <label>PR <span class="hint">ej. PR 9+500</span><input id="pr" placeholder="PR 9+500"></label>
    <label>Latitud<input id="lat" type="number" step="any" placeholder="10.9685"></label>
    <label>Longitud<input id="lng" type="number" step="any" placeholder="-74.7813"></label>
    <label>Carril<select id="car"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
    <label>Tipo de daño<select id="tdan"></select></label>
    <label>Tipología<select id="tip"></select></label>
    <label>Severidad<select id="sev"><option value="B">Baja (B)</option><option value="M">Media (M)</option><option value="A">Alta (A)</option></select></label>
    <fieldset><legend>Daño</legend>
      <label>Largo (m)<input id="dL" type="number" step="any" min="0"></label>
      <label class="anc">Ancho (m)<input id="dA" type="number" step="any" min="0"></label></fieldset>
    <fieldset><legend>Reparación</legend>
      <label>Largo (m)<input id="rL" type="number" step="any" min="0"></label>
      <label class="anc">Ancho (m)<input id="rA" type="number" step="any" min="0"></label></fieldset>
    <label class="full">Comentarios y aclaraciones<textarea id="com" placeholder="Observaciones del levantamiento, condiciones particulares, información adicional…"></textarea></label>
    <label class="full">Fotos (1 a 4) <span class="hint">La primera que subas será la foto principal.</span>
      <input id="fotos" type="file" accept="image/*" multiple></label>
    <div class="prev full" id="prev"></div>
  </div>
  <div class="mf"><button class="btn sec" data-act="close">Cancelar</button><button class="btn" id="saveBtn" data-act="save">Guardar ficha</button></div>
</div></div>

<!-- Modal vincular pin -->
<div class="modal" id="mPin"><div class="box" style="max-width:480px">
  <h3>Vincular pin a una ficha</h3>
  <p class="hint" id="pinCoord"></p>
  <label class="f" style="display:block"><select id="pinFicha" style="width:100%"></select></label>
  <div class="mf"><button class="btn sec" data-act="close">Cancelar</button><button class="btn" data-act="savepin">Guardar pin</button></div>
</div></div>
<div id="toast"></div>

const toast=(m,ms=3000)=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);if(ms)toast.t=setTimeout(()=>t.style.display="none",ms)};
const prVal=s=>{const m=String(s).match(/(\d+)\s*\+\s*(\d+)/);return m?+m[1]*1000+ +m[2]:(parseFloat(String(s).replace(/[^\d.]/g,""))||0)*1000};

/* ============ LOGO ============ */
$("#logo").innerHTML=(LOGO_SRC?`<img src="${LOGO_SRC}" alt="INVIAS">`:`<div class="ph">INVIAS</div>`)+`<div><b>Base de datos técnica de inspección</b><small>Inspección visual de vías · DT Atlántico</small></div>`;

/* ============ CAPA DE DATOS (Firestore o modo local) ============ */
const DB={fichas:[],pines:[]};
let store;
const setStatus=(ok,t)=>{$("#dot").className="dot"+(ok?" ok":"");$("#stxt").textContent=t};
if(firebaseConfig.apiKey&&firebaseConfig.projectId){
  try{
    const V="10.12.2",B=`https://www.gstatic.com/firebasejs/${V}/`;
    const {initializeApp}=await import(B+"firebase-app.js");
    const F=await import(B+"firebase-firestore.js");
    const db=F.getFirestore(initializeApp(firebaseConfig));
    for(const c of ["fichas","pines"])
      F.onSnapshot(F.collection(db,c),{includeMetadataChanges:true},s=>{
        DB[c]=s.docs.map(d=>({...d.data(),id:d.id}));
        setStatus(!s.metadata.fromCache&&navigator.onLine,!s.metadata.fromCache&&navigator.onLine?"Conectado · tiempo real":"Sin conexión");
        renderAll();
      },e=>{setStatus(false,"Error: "+e.code);console.error(e)});
    store={save:(c,id,d)=>F.setDoc(F.doc(db,c,id),d),del:(c,id)=>F.deleteDoc(F.doc(db,c,id))};
    addEventListener("offline",()=>setStatus(false,"Sin conexión"));
  }catch(e){console.error(e);setStatus(false,"Error al cargar Firebase")}
}
if(!store){
  setStatus(false,"Sin Firebase · modo local (los datos no se guardan)");
  store={save:async(c,id,d)=>{const a=DB[c],i=a.findIndex(x=>x.id===id);const o={...d,id};i<0?a.push(o):a[i]=o;renderAll()},
         del:async(c,id)=>{DB[c]=DB[c].filter(x=>x.id!==id);renderAll()}};
}
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+""+Math.random().toString(16).slice(2);

/* ============ FILTROS ============ */
const allTip=Object.values(TIPOS).flat();
$("#fVia").innerHTML=`<option value="">Seleccionar una vía...</option><option value="__all">Todas las vías</option>`+opts(VIAS);$("#fCalz").innerHTML=`<option value="">Todas las calzadas</option><option>Derecha</option><option>Izquierda</option>`;$("#fCar").innerHTML=opts([1,2,3,4],"Todos los carriles");
$("#fTipo").innerHTML=opts(Object.keys(TIPOS),"Todos los daños");$("#fTip").innerHTML=opts(allTip,"Todas las tipologías");
$("#fSev").innerHTML=`<option value="">Toda severidad</option>`+Object.entries(SEV).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
$("#fTipo").onchange=()=>{$("#fTip").innerHTML=opts($("#fTipo").value?TIPOS[$("#fTipo").value]:allTip,"Todas las tipologías");renderList()};
["q","fVia","fCalz","fCar","fTip","fSev"].forEach(i=>$("#"+i).addEventListener("input",renderList));

/* ============ TARJETAS ============ */
const area=(l,a,fis)=>fis?`${l||0} m (largo)`:`${l||0} × ${a||0} m`;
function fichaHTML(f,full){
  const fis=f.tipoDanio==="Fisuras",fo=f.fotos||[];
  const img=fo[0]?`<img class="ph" src="${fo[0]}" alt="Foto principal">`:`<div class="nofoto">Sin foto</div>`;
  const mos=fo.length>1?`<div class="mos ${full?"":"hide"}">${fo.slice(1).map(x=>`<img src="${x}" alt="">`).join("")}</div>`:"";
  return `${img}${mos}<div class="body"><h4><span>${esc(f.via)} · ${esc(f.pr)}</span><span class="badge ${f.severidad}">${SEV[f.severidad]} (${f.severidad})</span></h4>
  <dl><dt>Calzada</dt><dd>${f.ncal==2?esc(f.calzada):"Única"}</dd><dt>Carril</dt><dd>${esc(f.carril)}</dd>
  <dt>Latitud</dt><dd>${f.lat??"—"}</dd><dt>Longitud</dt><dd>${f.lng??"—"}</dd>
  <dt>Tipo de daño</dt><dd>${esc(f.tipoDanio)}</dd><dt>Tipología</dt><dd>${esc(f.tipologia)}</dd>
  <dt>Daño</dt><dd>${area(f.dL,f.dA,fis)}</dd><dt>Reparación</dt><dd>${area(f.rL,f.rA,fis)}</dd></dl>${f.comentarios?`<div class="com"><b>Comentarios y aclaraciones</b><p>${esc(f.comentarios)}</p></div>`:""}</div>`;
}
function getRows(){ // consulta actual: la usan tanto la vista como la exportación
  const via=$("#fVia").value;if(!via)return null;
  const q=$("#q").value.toLowerCase(),F={calzada:$("#fCalz").value,carril:$("#fCar").value,tipoDanio:$("#fTipo").value,tipologia:$("#fTip").value,severidad:$("#fSev").value};
  return DB.fichas.filter(f=>(via==="__all"||f.via===via)&&Object.entries(F).every(([k,v])=>!v||String(f[k])===v)&&(!q||[f.via,f.pr,f.tipologia,f.tipoDanio,f.calzada,f.comentarios].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>VIAS.indexOf(a.via)-VIAS.indexOf(b.via)||prVal(a.pr)-prVal(b.pr));
}
function renderList(){
  const rows=getRows();
  if(rows===null){$("#list").innerHTML=`<div class="empty">Selecciona una vía para visualizar las fichas técnicas.</div>`;return}
  if(!rows.length){$("#list").innerHTML=`<div class="empty">${DB.fichas.length?"Ninguna ficha coincide con los filtros.":"Aún no hay fichas. Pulsa «Añadir ficha» para crear la primera."}</div>`;return}
  const open=new Set([...document.querySelectorAll("details.via[open]")].map(d=>d.dataset.via));
  const by={};rows.forEach(f=>(by[f.via]??=[]).push(f));
  $("#list").innerHTML=VIAS.filter(v=>by[v]).map(v=>`<details class="via" data-via="${v}" ${open.has(v)||$("#fVia").value!=="__all"||$("#q").value?"open":""}>
   <summary><span>Vía ${v}</span><span class="hint">${by[v].length} ficha(s)</span></summary><div class="grid">
   ${by[v].map(f=>`<article class="card">${fichaHTML(f,false)}<div class="acts">
    ${(f.fotos||[]).length>1?`<button class="btn sec sm" data-act="fotos">Ver todas las fotos</button>`:""}
    <button class="btn sec sm" data-act="edit" data-id="${f.id}">Editar</button><button class="btn red sm" data-act="del" data-id="${f.id}">Eliminar</button></div></article>`).join("")}
   </div></details>`).join("");
}

/* ============ FORMULARIO ============ */
let editId=null,fotos=[];
$("#via").innerHTML=opts(VIAS);$("#tdan").innerHTML=opts(Object.keys(TIPOS));
const syncForm=()=>{
  $("#tip").innerHTML=opts(TIPOS[$("#tdan").value]);
  $("#calW").classList.toggle("hide",$("#ncal").value!=="2");
  document.querySelectorAll(".anc").forEach(e=>e.classList.toggle("hide",$("#tdan").value==="Fisuras"));
};
$("#tdan").onchange=syncForm;$("#ncal").onchange=syncForm;
function drawPrev(){
  $("#prev").innerHTML=fotos.map((s,i)=>`<div class="${i?"":"main"}"><img src="${s}" alt=""><button data-act="rmfoto" data-i="${i}" title="Quitar">×</button>${i?"":"<span>Principal</span>"}</div>`).join("");
}
const compress=file=>new Promise((res,rej)=>{
  const r=new FileReader();r.onerror=rej;
  r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
    const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.6))};im.src=r.result};
  r.readAsDataURL(file)});
$("#fotos").onchange=async e=>{
  for(const f of e.target.files){if(fotos.length>=4){toast("Máximo 4 fotos");break}fotos.push(await compress(f))}
  e.target.value="";drawPrev();
};
function openForm(f){
  editId=f?.id||null;fotos=[...(f?.fotos||[])];
  $("#mTitle").textContent=f?"Editar ficha":"Añadir ficha";
  $("#via").value=f?.via||VIAS[0];$("#ncal").value=f?.ncal||1;$("#tdan").value=f?.tipoDanio||Object.keys(TIPOS)[0];syncForm();
  $("#tip").value=f?.tipologia||$("#tip").options[0].value;$("#calz").value=f?.calzada||"Derecha";
  $("#pr").value=f?.pr||"";$("#lat").value=f?.lat??"";$("#lng").value=f?.lng??"";$("#car").value=f?.carril||1;$("#sev").value=f?.severidad||"B";
  $("#dL").value=f?.dL??"";$("#dA").value=f?.dA??"";$("#rL").value=f?.rL??"";$("#rA").value=f?.rA??"";$("#com").value=f?.comentarios||"";
  drawPrev();$("#mFicha").classList.add("on");
}
async function saveFicha(){
  const pr=$("#pr").value.trim();
  if(!pr||!fotos.length){toast("Indica el PR y sube al menos una foto");return}
  const lat=$("#lat").value===""?null:+$("#lat").value,lng=$("#lng").value===""?null:+$("#lng").value;
  const fis=$("#tdan").value==="Fisuras",n=id=>$("#"+id).value===""?null:+$("#"+id).value;
  const f={via:$("#via").value,ncal:+$("#ncal").value,calzada:$("#ncal").value==="2"?$("#calz").value:null,pr,prVal:prVal(pr),lat,lng,
    carril:+$("#car").value,tipoDanio:$("#tdan").value,tipologia:$("#tip").value,severidad:$("#sev").value,
    comentarios:$("#com").value.trim(),dL:n("dL"),dA:fis?null:n("dA"),rL:n("rL"),rA:fis?null:n("rA"),fotos,ts:Date.now()};
  const id=editId||uid();$("#saveBtn").disabled=true;
  try{
    await store.save("fichas",id,f);
    if(lat!=null&&lng!=null){ // el pin de la ficha usa el mismo id que la ficha
      const p=DB.pines.find(x=>x.id===id);await store.save("pines",id,{fichaId:id,lat,lng})}
    $("#mFicha").classList.remove("on");toast("Ficha guardada");
  }catch(e){console.error(e);toast("No se pudo guardar. Revisa la conexión y el tamaño de las fotos.")}
  $("#saveBtn").disabled=false;
}

/* ============ MAPA ============ */
let map,layer,pinMode=false,pending=null;
function initMap(){
  if(map)return;
  map=L.map("map").setView([10.69,-74.95],10); // Departamento del Atlántico
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
  layer=L.layerGroup().addTo(map);
  map.on("click",e=>{
    if(!pinMode)return;
    if(!DB.fichas.length){toast("Primero crea una ficha para vincular");return}
    pending=e.latlng;
    $("#pinCoord").textContent=`Ubicación: ${pending.lat.toFixed(6)}, ${pending.lng.toFixed(6)}`;
    $("#pinFicha").innerHTML=[...DB.fichas].sort((a,b)=>a.via.localeCompare(b.via)||prVal(a.pr)-prVal(b.pr)).map(f=>`<option value="${f.id}">${esc(f.via)} · ${esc(f.pr)} · ${esc(f.tipologia)} (${f.severidad})</option>`).join("");
    $("#mPin").classList.add("on");
  });
}
function renderMap(){
  if(!map)return;layer.clearLayers();
  DB.pines.forEach(p=>{
    const f=DB.fichas.find(x=>x.id===p.fichaId);if(!f)return;
    const ic=L.divIcon({className:"",html:`<div class="pin" style="background:${COL[f.severidad]}"></div>`,iconSize:[20,20],iconAnchor:[10,20]});
    L.marker([p.lat,p.lng],{icon:ic}).addTo(layer)
     .bindPopup(`<div class="card" style="border:0">${fichaHTML(f,true)}<div class="acts"><button class="btn red sm" data-act="delpin" data-id="${p.id}">Eliminar pin</button></div></div>`);
  });
}
function setPinMode(on){
  pinMode=on;const b=$("#pinMode");b.className="btn "+(on?"on":"sec");b.textContent="Añadir pin: "+(on?"activado":"desactivado");
  $("#mapHint").textContent=on?"Haz clic en el mapa para colocar el pin.":"";
  if(map)map.getContainer().style.cursor=on?"crosshair":"";
}
const renderAll=()=>{renderList();renderMap()};

/* ============ EXPORTAR A EXCEL (con fotos embebidas) ============ */
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
async function thumb(src){ // copia reducida solo para el Excel; el original en Firestore no se toca
  const im=await loadImg(src),k=Math.min(1,200/im.width,150/im.height),w=Math.round(im.width*k),h=Math.round(im.height*k);
  const c=document.createElement("canvas");c.width=Math.round(w*1.5);c.height=Math.round(h*1.5);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  return {data:c.toDataURL("image/jpeg",.8).split(",")[1],w,h};
}
const fechaHoy=()=>{const d=new Date(),z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};
async function exportXlsx(){
  const rows=getRows();
  if(rows===null){toast("Selecciona una vía para exportar");return}
  if(!rows.length){toast("No hay fichas para exportar con los filtros actuales");return}
  if(!window.ExcelJS){toast("No se pudo cargar la librería de Excel. Revisa la conexión.");return}
  const btn=$("#xlsBtn"),via=$("#fVia").value;btn.disabled=true;btn.textContent="Exportando…";
  let errores=0;
  try{
    toast("Preparando exportación...",0);await new Promise(x=>setTimeout(x,30));
    const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet("Inspección Vial");
    const H=["Vía","Número de calzadas","Calzada","PR","Carril","Tipo de daño","Tipología","Código de tipología","Severidad","Daño - Largo (m)","Daño - Ancho (m)","Reparación - Largo (m)","Reparación - Ancho (m)","Comentarios y aclaraciones","Número de fotos","Foto 1","Foto 2","Foto 3","Foto 4"];
    const W=[10,12,12,12,8,24,36,14,12,12,12,14,14,40,10,31,31,31,31];
    ws.columns=H.map((h,i)=>({header:h,width:W[i]}));
    const hr=ws.getRow(1);hr.height=34;hr.font={bold:true,color:{argb:"FFFFFFFF"}};
    hr.alignment={vertical:"middle",horizontal:"center",wrapText:true};
    hr.eachCell(c=>c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFEB773B"}});
    ws.views=[{state:"frozen",ySplit:1}];
    ws.autoFilter={from:{row:1,column:1},to:{row:1,column:H.length}};
    for(let r=0;r<rows.length;r++){
      toast(`Procesando fotografías... (ficha ${r+1} de ${rows.length})`,0);
      const f=rows[r],fo=Array.isArray(f.fotos)?f.fotos:[],cod=(String(f.tipologia||"").match(/\(([^)]+)\)\s*$/)||[])[1]||"";
      const row=ws.addRow([f.via||"",f.ncal||1,f.ncal==2?(f.calzada||""):"Única",f.pr||"",f.carril??"",f.tipoDanio||"",f.tipologia||"",cod,SEV[f.severidad]||f.severidad||"",
        f.dL??"",f.dA??"",f.rL??"",f.rA??"",f.comentarios||"",fo.length]);
      row.height=124;row.alignment={vertical:"middle",wrapText:true};
      for(let i=0;i<Math.min(4,fo.length);i++){
        try{
          const t=await thumb(fo[i]),id=wb.addImage({base64:t.data,extension:"jpeg"});
          // centrada en la celda (columna de ~222 px, fila de ~165 px)
          ws.addImage(id,{tl:{col:15+i+Math.max(0,(222-t.w)/2/222),row:r+1+Math.max(0,(165-t.h)/2/165)},ext:{width:t.w,height:t.h},editAs:"oneCell"});
        }catch(e){errores++;console.warn("Foto con error",f.id,i+1,e);row.getCell(16+i).value="Error al exportar imagen"}
      }
      if(r%5===4)await new Promise(x=>setTimeout(x)); // cede el control para no congelar la interfaz
    }
    toast("Generando archivo Excel...",0);await new Promise(x=>setTimeout(x,30));
    const buf=await wb.xlsx.writeBuffer();
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    a.download=`Inspeccion_Vial_${via==="__all"?"Todas_las_Vias":via}_${fechaHoy()}.xlsx`;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast(errores?`Exportación completada con ${errores} imagen(es) que no se pudieron procesar (marcadas en el Excel).`:"Exportación completada.",errores?9000:4000);
  }catch(e){console.error(e);toast("Error al generar el Excel",6000)}
  btn.disabled=false;btn.textContent="Exportar a Excel";
}

/* ============ EVENTOS ============ */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button,.tab").forEach(e=>e.classList.remove("on"));
  b.classList.add("on");$("#"+b.dataset.tab).classList.add("on");
  if(b.dataset.tab==="t2"){initMap();renderMap();setTimeout(()=>map.invalidateSize(),50)}
});
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,id=t.dataset.id;
  if(a==="new")openForm();
  else if(a==="close")document.querySelectorAll(".modal").forEach(m=>m.classList.remove("on"));
  else if(a==="save")saveFicha();
  else if(a==="export")exportXlsx();
  else if(a==="edit")openForm(DB.fichas.find(f=>f.id===id));
  else if(a==="fotos"){const m=t.closest(".card").querySelector(".mos");m.classList.toggle("hide");t.textContent=m.classList.contains("hide")?"Ver todas las fotos":"Ocultar fotos"}
  else if(a==="rmfoto"){fotos.splice(+t.dataset.i,1);drawPrev()}
  else if(a==="del"){if(confirm("¿Eliminar esta ficha y su pin?")){await store.del("fichas",id);for(const p of DB.pines.filter(p=>p.fichaId===id))await store.del("pines",p.id);toast("Ficha eliminada")}}
  else if(a==="delpin"){if(confirm("¿Eliminar este pin?")){map.closePopup();await store.del("pines",id);toast("Pin eliminado")}}
  else if(a==="pinmode")setPinMode(!pinMode);
  else if(a==="savepin"){
    await store.save("pines",uid(),{fichaId:$("#pinFicha").value,lat:pending.lat,lng:pending.lng});
    $("#mPin").classList.remove("on");toast("Pin guardado");
  }
});
syncForm();renderAll();
</script>
</body>
</html>
